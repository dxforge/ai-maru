[package]
name = "maru"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.32", features = ["event"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
nix = { version = "0.32", features = ["process", "signal", "term"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3"
