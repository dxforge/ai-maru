[package]
name = "maru"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["event"] }
serde_json = "1"

[dev-dependencies]
nix = { version = "0.29", features = ["process", "signal", "term"] }
tempfile = "3"
