name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: core

jobs:
  # 바뀐 경로를 보고 job 을 건너뛴다. workflow 의 on.paths 로 거르면 workflow 가 돌지 않아 required check 가 보고되지 않고 머지가 막힌다. job 수준 if 로 건너뛴 job 은 성공으로 보고된다.
  # needs 가 실패해 건너뛴 job 도 성공으로 보고되므로, 뒤 job 은 이 job 이 성공하지 못하면 건너뛰지 않고 돈다.
  # main push 에서는 이 job 을 건너뛰어 뒤 job 이 모두 돈다. paths-filter 는 push 전과 뒤의 main 만 비교하므로, main 에서 실패한 검사도 다음 push 가 그 경로를 바꾸지 않으면 건너뜀(성공)으로 보고되어 실패가 가려진다.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'core/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'

  fmt:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  # job 수준 if 는 matrix 를 펼치기 전에 판정되므로, matrix job 을 건너뛰면 required check `rust (macos-15)` 가 보고되지 않는 것으로 보인다. 그래서 matrix 없이 그 이름을 직접 단다.
  rust:
    name: rust (macos-15)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: grep '^ZIG_VERSION=' ghostty-vt.env >> "$GITHUB_ENV"
      # rust-cache 는 저장하기 전에 target 아래에서 deps·build·.fingerprint 의 의존성 산출물 말고는 파일을 지우므로, build.rs 가 target/ghostty-vt 에 둔 라이브러리가 다음 실행에 남지 않는다.
      - run: echo "MARU_GHOSTTY_VT_DIR=$RUNNER_TEMP/ghostty-vt" >> "$GITHUB_ENV"
      - id: ghostty-vt
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MARU_GHOSTTY_VT_DIR }}
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/ghostty-vt.env', 'core/scripts/build-ghostty-vt.sh') }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: scripts/build-ghostty-vt.sh "$MARU_GHOSTTY_VT_DIR"
      # clippy·test 가 실패해도 빌드한 라이브러리를 저장하려고 save 단계를 따로 둔다. actions/cache 의 post 단계는 job 이 성공할 때만 저장하기 때문이다.
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MARU_GHOSTTY_VT_DIR }}
          key: ${{ steps.ghostty-vt.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
