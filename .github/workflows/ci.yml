name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: core

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: grep '^ZIG_VERSION=' ghostty-vt.env >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  app-e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: grep '^ZIG_VERSION=' ghostty-vt.env >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo build
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # Chromium 은 chrome-sandbox 가 root 소유 4755 가 아니면 띄우기를 멈춘다.
      - if: runner.os == 'Linux'
        run: |
          sandbox=$(find node_modules/.pnpm -path '*/electron/dist/chrome-sandbox')
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
        working-directory: app
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
        working-directory: app
      - if: runner.os != 'Linux'
        run: pnpm test:e2e
        working-directory: app
