name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: core

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: grep '^ZIG_VERSION=' ghostty-vt.env >> "$GITHUB_ENV"
      # rust-cache 는 저장하기 전에 target 아래에서 deps·build·.fingerprint 의 의존성 산출물 말고는 파일을 지우므로, build.rs 가 target/ghostty-vt 에 둔 라이브러리가 다음 실행에 남지 않는다.
      - run: echo "MARU_GHOSTTY_VT_DIR=$RUNNER_TEMP/ghostty-vt" >> "$GITHUB_ENV"
      - id: ghostty-vt
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MARU_GHOSTTY_VT_DIR }}
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/ghostty-vt.env', 'core/scripts/build-ghostty-vt.sh') }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: scripts/build-ghostty-vt.sh "$MARU_GHOSTTY_VT_DIR"
      # clippy·test 가 실패해도 빌드한 라이브러리를 저장하려고 save 단계를 따로 둔다. actions/cache 의 post 단계는 job 이 성공할 때만 저장하기 때문이다.
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MARU_GHOSTTY_VT_DIR }}
          key: ${{ steps.ghostty-vt.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
