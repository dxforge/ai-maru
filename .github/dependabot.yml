version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    ignore:
      # 타입은 앱이 실제로 쓰는 Electron 의 Node 메이저 버전에 맞춰 직접 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Electron 45.2.3·45.3.0 의 canvas 는 앞에 공백이 붙은 `ctx.font` 값을 받지 않으므로, `@xterm/addon-webgl` 이 글자를 기본 글꼴로 그린다.
      # electron/electron#55616 이 고쳐지면 이 항목을 지운다.
      - dependency-name: electron
        versions: ["45.2.3", "45.3.0"]
    groups:
      # addon 두 개의 peer 가 `@xterm/xterm` 의 특정 beta 이상을 요구하므로 세 패키지를 한 group 으로 올린다.
      # 먼저 맞는 group 에 들어가므로 minor-and-patch 보다 앞에 둔다.
      xterm:
        patterns: ["@xterm/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
