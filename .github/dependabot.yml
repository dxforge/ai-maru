version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    ignore:
      # 타입은 앱이 실제로 쓰는 Electron 의 Node 메이저 버전에 맞춰 직접 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # addon 두 개의 peer 가 `@xterm/xterm` 의 특정 beta 이상을 요구하므로 세 패키지를 한 group 으로 올린다.
      # 먼저 맞는 group 에 들어가므로 minor-and-patch 보다 앞에 둔다.
      xterm:
        patterns: ["@xterm/*"]
      # Electron 45.2.3~45.3.1 에서 `@xterm/addon-webgl` 이 글자를 기본 글꼴로 그렸으므로(45.3.2 에서 고쳐졌다), electron 새 버전은 따로 PR 을 받아 e2e 로 확인한다.
      # electron 이 minor-and-patch PR 에 섞이면, 그 PR 을 받지 않는 동안 함께 묶인 다른 패키지 업데이트도 받지 못한다.
      electron:
        patterns: ["electron"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
