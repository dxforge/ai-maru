<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363a4f"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS 아이콘 규격: 1024 캔버스 가운데 824 둥근 사각형, 둘레 100px 투명 -->
  <g clip-path="url(#squircle)">
  <g transform="translate(100 100) scale(0.8046875)">

  <rect width="1024" height="1024" fill="#181825"/>

  <rect width="1024" height="130" fill="url(#bg)"/>
  <ellipse cx="512" cy="0" rx="600" ry="130" fill="white" opacity="0.05"/>
  <circle cx="200" cy="65" r="20" fill="#f38ba8" opacity="0.8"/>
  <circle cx="270" cy="65" r="20" fill="#a6e3a1" opacity="0.8"/>
  <circle cx="340" cy="65" r="20" fill="#f9e2af" opacity="0.8"/>

  <circle cx="340" cy="400" r="60" fill="#89b4fa" filter="url(#glow)" opacity="0.9"/>
  <circle cx="684" cy="400" r="60" fill="#89b4fa" filter="url(#glow)" opacity="0.9"/>

  <polyline
    points="290,640 400,720 290,800"
    fill="none"
    stroke="#cdd6f4"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <rect x="450" y="703" width="170" height="38" rx="10" fill="#cdd6f4" opacity="0.8" filter="url(#glow)"/>
  </g>
  </g>
</svg>
