appId: com.dxforge.ai-maru
# 런타임 앱 이름은 번들 안 package.json 에서 온다. app/package.json 에 넣으면 dev 와 설치본이
# userData·단일 인스턴스 잠금을 같이 써서, 설치본이 떠 있는 동안 dev 가 뜨지 못한다.
extraMetadata:
  productName: AI Maru
directories:
  output: dist
  buildResources: build
# package.json 의 dependencies 는 files 와 상관없이 node_modules 로 asar 에 실린다. renderer 가
# 쓰는 패키지는 vite 가 out/ 에 묶으므로 devDependencies 에 둔다 — dependencies 에는 main 이
# 런타임에 불러오는 것만.
files:
  - out/**
extraResources:
  - from: ../core/target/release/maru-pty
    to: bin/maru-pty
  - from: ../core/target/release/maru
    to: bin/maru
  # 앱 `shellEnv`(`pty.ts`)와 `.zshenv` 의 `_maru_path` 는 claude shim 을 claude-plugin 옆 `bin` 에서 찾으므로, claude-plugin 과 같은 부모 아래 `bin` 에 둔다.
  - from: resources/bin/claude
    to: bin/claude
  - from: resources/zsh/.zshenv
    to: zsh/.zshenv
  - from: resources/claude-plugin
    to: claude-plugin
  # 재시작 전 앱이 설치된 번들의 상태 파일 형식 버전을 읽는다(src/main/restart.ts).
  - from: resources/state-versions.json
    to: state-versions.json
mac:
  target: dir
  category: public.app-category.developer-tools
  # 머신에 서명 인증서가 있어도 집어 쓰지 않는다 — 공증하지 않으므로 어느 머신에서 빌드해도 같게.
  identity: '-'
  # ad-hoc 서명에 hardened runtime 을 켜면 library validation 에 걸려 앱이 안 뜰 수 있다고 electron-builder 가 경고한다. 공증하지 않으면 필요 없다.
  hardenedRuntime: false
